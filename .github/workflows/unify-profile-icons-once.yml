name: Unify profile technology icon labels and display scale (one-time)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/unify-profile-icons-once.yml

permissions:
  contents: write

jobs:
  unify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install image dependency
        run: python3 -m pip install --disable-pip-version-check pillow
      - name: Retrieve the same open-source font used in the README labels
        run: |
          mkdir -p /tmp/profile-font
          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/github/mona-sans/main/fonts/static/otf/MonaSans-Regular.otf" \
            -o /tmp/profile-font/MonaSans-Regular.otf
          test -s /tmp/profile-font/MonaSans-Regular.otf
      - name: Keep icon artwork unchanged and make all labels identical
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          from PIL import Image, ImageDraw, ImageFont, ImageChops

          folder = Path("assets/tech-icons")
          font = ImageFont.truetype("/tmp/profile-font/MonaSans-Regular.otf", 24)
          cell_width = 182
          image_height = 168
          icon_region_height = 120
          full_width = 11 * cell_width
          themes = {"dark": "#f0f6fc", "light": "#1f2328"}
          sections = {
              "languages": [
                  "Kotlin", "Java", "Python", "PHP", "JavaScript", "TypeScript",
                  "HTML", "CSS", "C", "C#", "Swift"
              ],
              "frameworks": [
                  "Android Studio", "React", "Next.js", "Tailwind CSS", "Node.js",
                  "Express", "Vite", "Firebase", "Gradle", "SwiftUI", "Xcode"
              ],
              "tools": [
                  "MySQL", "SQLite", "Supabase", "Git", "GitHub", "VS Code",
                  "Playwright", "Storybook", "Netlify"
              ],
              "databases-extra": ["SQL", "PL/SQL", "MongoDB", "MariaDB"]
          }

          # Each row uses the 11-column reference width, even when it contains
          # fewer icons. GitHub then scales every row in the same way.
          for group, labels in sections.items():
              for theme, font_color in themes.items():
                  path = folder / f"{group}-{theme}.png"
                  with Image.open(path) as im:
                      original = im.convert("RGBA")
                  expected_width = len(labels) * cell_width
                  if original.size != (expected_width, image_height):
                      raise RuntimeError(f"Source size changed: {path}: {original.size}")

                  # Upper 120 px contain icon art only. Old caption pixels
                  # are discarded instead of overpainted, so every label has
                  # precisely the same Mona Sans font and exact GitHub color.
                  icon_region = original.crop(
                      (0, 0, original.width, icon_region_height)
                  )
                  icon_hash = sha256(icon_region.tobytes()).hexdigest()
                  output = Image.new(
                      "RGBA", (full_width, image_height), (0, 0, 0, 0)
                  )
                  output.paste(icon_region, (0, 0))
                  draw = ImageDraw.Draw(output)

                  for index, label in enumerate(labels):
                      x = index * cell_width + cell_width // 2
                      draw.text(
                          (x, 148),
                          label,
                          font=font,
                          fill=font_color,
                          anchor="ms"
                      )

                  after = output.crop(
                      (0, 0, original.width, icon_region_height)
                  )
                  if sha256(after.tobytes()).hexdigest() != icon_hash:
                      raise RuntimeError(f"Existing icon pixels changed: {path}")
                  if ImageChops.difference(icon_region, after).getbbox():
                      raise RuntimeError(f"Icon pixel-level diff: {path}")

                  # Also verify every caption has pixels in the expected color.
                  rgb = tuple(bytes.fromhex(font_color[1:]))
                  for index, label in enumerate(labels):
                      bounds = (index*cell_width, 120, (index+1)*cell_width, 168)
                      pixels = output.crop(bounds).getdata()
                      if not any(px[:3] == rgb and px[3] == 255 for px in pixels):
                          raise RuntimeError(f"Caption color mismatch for {label}: {path}")

                  output.save(path, "PNG", optimize=True)
                  with Image.open(path) as valid:
                      valid.verify()
                  print(
                      f"VERIFIED {path}: {len(labels)} unchanged icons, "
                      f"{full_width}x{image_height}, captions {font_color}, "
                      f"icon SHA-256 {icon_hash[:16]}"
                  )

          readme = Path("README.md")
          content = readme.read_text(encoding="utf-8")
          old = {
              'alt="Iconos y nombres: MySQL, SQLite, Supabase, Git, GitHub, VS Code, Playwright, Storybook y Netlify" width="819"':
              'alt="Iconos y nombres: MySQL, SQLite, Supabase, Git, GitHub, VS Code, Playwright, Storybook y Netlify" width="1001"',
              'alt="Iconos y nombres: SQL, PL/SQL, MongoDB y MariaDB" width="364"':
              'alt="Iconos y nombres: SQL, PL/SQL, MongoDB y MariaDB" width="1001"'
          }
          for before, after in old.items():
              if content.count(before) != 1:
                  raise RuntimeError(f"Unexpected README structure: {before}")
              content = content.replace(before, after, 1)
          if content.count("<picture>") != 4:
              raise RuntimeError("Expected exactly four technology image rows")
          if not all(key in content for key in (
              "FitnessApp", "HorseApp", "SwiftUI", "Odoo", "Qiskit Hackathon"
          )):
              raise RuntimeError("Unrelated profile content would be lost")
          readme.write_text(content, encoding="utf-8")
          PY
      - name: Publish verified icon rows and delete this one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/tech-icons/languages-dark.png assets/tech-icons/languages-light.png assets/tech-icons/frameworks-dark.png assets/tech-icons/frameworks-light.png assets/tech-icons/tools-dark.png assets/tech-icons/tools-light.png assets/tech-icons/databases-extra-dark.png assets/tech-icons/databases-extra-light.png
          git rm .github/workflows/unify-profile-icons-once.yml
          git diff --cached --stat
          git commit -m "Unify technology icons and labels across GitHub README themes"
          git push origin HEAD:main
