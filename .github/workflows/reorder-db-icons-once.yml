name: Move MongoDB and MariaDB next to Netlify (one-time)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/reorder-db-icons-once.yml

permissions:
  contents: write

jobs:
  reorder:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install image verification dependency
        run: python3 -m pip install --disable-pip-version-check pillow
      - name: Reposition existing icon pixels without rerendering
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageChops
          from hashlib import sha256

          root = Path("assets/tech-icons")
          cell, cols, height = 182, 11, 168
          w = cell * cols
          top_count, low_count = 9, 4

          for theme in ("dark", "light"):
              top_file = root / f"tools-{theme}.png"
              low_file = root / f"databases-extra-{theme}.png"
              with Image.open(top_file) as img:
                  top = img.convert("RGBA")
              with Image.open(low_file) as img:
                  low = img.convert("RGBA")
              if top.size != (w, height) or low.size != (w, height):
                  raise RuntimeError(f"Unexpected image sizes in {theme}: {top.size}, {low.size}")

              # The first row has two empty 182px cells following Netlify.
              top_empty_area = top.crop((top_count * cell, 0, w, height))
              if top_empty_area.getbbox() is not None:
                  raise RuntimeError(f"First-row slots are not empty in {theme}")
              if low.crop((low_count * cell, 0, w, height)).getbbox() is not None:
                  raise RuntimeError(f"Second-row trailing cells unexpectedly contain content in {theme}")

              previous_nine = top.crop((0, 0, top_count * cell, height))
              sql_and_plsql = low.crop((0, 0, 2 * cell, height))
              mongo_and_maria = low.crop((2 * cell, 0, 4 * cell, height))

              # Exact pixel copies include the original labels, spacing and
              # theme-aware text colors. No fonts or icons are regenerated.
              top_new = top.copy()
              top_new.paste(mongo_and_maria, (top_count * cell, 0))

              low_new = Image.new("RGBA", (w, height), (0, 0, 0, 0))
              low_new.paste(sql_and_plsql, (0, 0))

              comparisons = (
                  ("first nine original icons", previous_nine, top_new.crop((0, 0, 9*cell, height))),
                  ("MongoDB and MariaDB", mongo_and_maria, top_new.crop((9*cell, 0, 11*cell, height))),
                  ("SQL and PL/SQL", sql_and_plsql, low_new.crop((0, 0, 2*cell, height))),
              )
              for title, before, after in comparisons:
                  if sha256(before.tobytes()).digest() != sha256(after.tobytes()).digest():
                      raise RuntimeError(f"Artwork mismatch ({title}) in {theme}")
                  if ImageChops.difference(before, after).getbbox():
                      raise RuntimeError(f"Pixel difference ({title}) in {theme}")
              if low_new.crop((2*cell, 0, w, height)).getbbox() is not None:
                  raise RuntimeError(f"Unexpected extra elements on second row in {theme}")

              top_new.save(top_file, "PNG", optimize=True)
              low_new.save(low_file, "PNG", optimize=True)
              for name in (top_file, low_file):
                  with Image.open(name) as img:
                      img.verify()
              print(f"VERIFIED {theme}: 11 icons in row 1, 2 in row 2; original pixels kept; each image {w}x{height}")

          readme_path = Path("README.md")
          text = readme_path.read_text(encoding="utf-8")
          names = {
              "Iconos y nombres: MySQL, SQLite, Supabase, Git, GitHub, VS Code, Playwright, Storybook y Netlify":
              "Iconos y nombres: MySQL, SQLite, Supabase, Git, GitHub, VS Code, Playwright, Storybook, Netlify, MongoDB y MariaDB",
              "Iconos y nombres: SQL, PL/SQL, MongoDB y MariaDB":
              "Iconos y nombres: SQL y PL/SQL",
          }
          for before, after in names.items():
              if text.count(before) != 1:
                  raise RuntimeError(f"README unexpected content: {before}")
              text = text.replace(before, after, 1)
          for ref in ('tools-light.png', 'tools-dark.png', 'databases-extra-light.png', 'databases-extra-dark.png'):
              if ref not in text:
                  raise RuntimeError(f"Missing image reference: {ref}")
          if text.count('width="800"') != 4:
              raise RuntimeError("The requested 800px image width has changed")
          for name in ("FitnessApp", "HorseApp", "SwiftUI", "Odoo", "Qiskit Hackathon"):
              if name not in text:
                  raise RuntimeError(f"Missing unrelated README section: {name}")
          readme_path.write_text(text, encoding="utf-8")
          PY
      - name: Publish reordered rows and remove this one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/tech-icons/tools-dark.png assets/tech-icons/tools-light.png assets/tech-icons/databases-extra-dark.png assets/tech-icons/databases-extra-light.png
          git rm .github/workflows/reorder-db-icons-once.yml
          git diff --cached --stat
          git commit -m "Move MongoDB and MariaDB beside Netlify without changing icon sizes"
          git push origin HEAD:main
