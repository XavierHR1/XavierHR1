name: Convert profile technology icon rows to PNG (one-time)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/convert-profile-icons-once.yml

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install SVG rasterizer
        run: python3 -m pip install --disable-pip-version-check cairosvg pillow
      - name: Convert the three existing SVG rows into PNG
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import cairosvg
          from PIL import Image
          for name in ("languages", "frameworks", "tools"):
              src = Path("assets/tech-icons") / f"{name}.svg"
              dest = src.with_suffix(".png")
              cairosvg.svg2png(url=str(src), write_to=str(dest), scale=2)
              with Image.open(dest) as img:
                  img.verify()
                  print(dest, dest.stat().st_size)
          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          for name in ("languages", "frameworks", "tools"):
              old = f"assets/tech-icons/{name}.svg"
              if old not in text:
                  raise RuntimeError(f"Missing README image reference: {old}")
              text = text.replace(old, f"assets/tech-icons/{name}.png")
          readme.write_text(text, encoding="utf-8")
          PY
      - name: Publish PNG files and remove this one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/tech-icons/languages.png assets/tech-icons/frameworks.png assets/tech-icons/tools.png
          git rm .github/workflows/convert-profile-icons-once.yml
          git diff --cached --stat
          git commit -m "Fix profile icons rendering with PNG assets"
          git push origin HEAD:main
