name: Group IDEs, frameworks, databases and tests (one-time)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/group-profile-technologies-once.yml

permissions:
  contents: write

jobs:
  regroup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install image tooling
        run: python3 -m pip install --disable-pip-version-check pillow cairosvg
      - name: Fetch Eclipse icon and the label font
        run: |
          mkdir -p /tmp/profile-icons
          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/syvixor/skills-icons/main/icons/eclipseide.svg" \
            -o /tmp/profile-icons/eclipseide.svg
          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/github/mona-sans/main/fonts/static/otf/MonaSans-Regular.otf" \
            -o /tmp/profile-icons/MonaSans-Regular.otf
          test -s /tmp/profile-icons/eclipseide.svg
          test -s /tmp/profile-icons/MonaSans-Regular.otf
      - name: Copy original icon pixels into grouped rows and add Eclipse
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          import io
          import re
          import cairosvg
          from PIL import Image, ImageDraw, ImageFont, ImageChops

          assets = Path("assets/tech-icons")
          cell_width, image_width, height = 182, 2002, 168
          old_groups = {
              "frameworks-sorted-20261123": [
                  "Android Studio", "Xcode", "React", "Next.js", "SwiftUI",
                  "Tailwind CSS", "Node.js", "Express", "Vite", "Firebase", "Gradle"
              ],
              "tools-sorted-20261123": [
                  "SQL", "PL/SQL", "Playwright", "Storybook", "MySQL",
                  "SQLite", "MongoDB", "MariaDB", "Supabase", "Git", "GitHub"
              ],
              "databases-sorted-20261123": ["VS Code", "Netlify"],
          }
          # IDEs first, then application frameworks. Database languages and
          # engines first, then tests and all remaining dev tools.
          new_groups = {
              "ides-v2-20261123": [
                  "Android Studio", "Xcode", "Eclipse", "VS Code"
              ],
              "frameworks-v2-20261123": [
                  "React", "Next.js", "SwiftUI", "Tailwind CSS", "Node.js",
                  "Express", "Vite", "Firebase", "Gradle"
              ],
              "databases-v2-20261123": [
                  "SQL", "PL/SQL", "MySQL", "SQLite",
                  "MongoDB", "MariaDB", "Supabase"
              ],
              "tools-v2-20261123": [
                  "Playwright", "Storybook", "Git", "GitHub", "Netlify"
              ],
          }
          source_labels = [label for group in old_groups.values() for label in group]
          target_labels = [label for group in new_groups.values() for label in group]
          if len(source_labels) != 24 or len(set(source_labels)) != 24:
              raise RuntimeError("Unexpected source technology count")
          if sorted(target_labels) != sorted(source_labels + ["Eclipse"]):
              raise RuntimeError("Target would omit or duplicate a technology")

          font = ImageFont.truetype(
              "/tmp/profile-icons/MonaSans-Regular.otf", 24
          )
          eclipse_svg = Path("/tmp/profile-icons/eclipseide.svg").read_bytes()
          eclipse_png = cairosvg.svg2png(
              bytestring=eclipse_svg, output_width=104, output_height=104
          )
          with Image.open(io.BytesIO(eclipse_png)) as image:
              eclipse_icon = image.convert("RGBA")
          if eclipse_icon.size != (104, 104) or not eclipse_icon.getbbox():
              raise RuntimeError("Eclipse icon failed to render")

          for theme, text_color in (
              ("dark", "#f0f6fc"), ("light", "#1f2328")
          ):
              original_cells = {}
              for group, labels in old_groups.items():
                  filepath = assets / f"{group}-{theme}.png"
                  with Image.open(filepath) as source_file:
                      source = source_file.convert("RGBA")
                  if source.size != (image_width, height):
                      raise RuntimeError(f"Source image dimensions changed: {filepath}")
                  for index, name in enumerate(labels):
                      tile = source.crop((
                          index * cell_width, 0,
                          (index + 1) * cell_width, height
                      ))
                      original_cells[name] = tile
              if len(original_cells) != 24:
                  raise RuntimeError("Missing source tiles")

              eclipse_tile = Image.new(
                  "RGBA", (cell_width, height), (0, 0, 0, 0)
              )
              eclipse_tile.alpha_composite(eclipse_icon, (39, 8))
              draw = ImageDraw.Draw(eclipse_tile)
              draw.text(
                  (cell_width // 2, 148), "Eclipse",
                  font=font, fill=text_color, anchor="ms"
              )
              if not eclipse_tile.getbbox():
                  raise RuntimeError("Eclipse label or icon is blank")
              original_cells["Eclipse"] = eclipse_tile

              for target, labels in new_groups.items():
                  image = Image.new(
                      "RGBA", (image_width, height), (0, 0, 0, 0)
                  )
                  for index, name in enumerate(labels):
                      image.paste(original_cells[name], (index*cell_width, 0))
                      restored = image.crop((
                          index*cell_width, 0,
                          (index+1)*cell_width, height
                      ))
                      original = original_cells[name]
                      if sha256(restored.tobytes()).digest() != sha256(original.tobytes()).digest():
                          raise RuntimeError(f"Icon or label changed for {name}")
                      if ImageChops.difference(restored, original).getbbox():
                          raise RuntimeError(f"Pixel-level mismatch for {name}")
                  if image.crop((len(labels)*cell_width, 0, image_width, height)).getbbox():
                      raise RuntimeError(f"Unexpected pixels after last icon in {target}")

                  outfile = assets / f"{target}-{theme}.png"
                  if outfile.exists():
                      raise RuntimeError(f"Existing file would be overwritten: {outfile}")
                  image.save(outfile, format="PNG", optimize=True)
                  with Image.open(outfile) as verify:
                      verify.verify()
                  print(f"VERIFIED {outfile}: {len(labels)} icons, 800px display width, original pixels kept")

          readme_file = Path("README.md")
          text = readme_file.read_text(encoding="utf-8")
          first = text.index("**Desarrollo de aplicaciones y frameworks**")
          last = text.index("**Integración Android, pruebas y calidad**", first)
          previous_section = text[first:last]
          if previous_section.count("<picture>") != 3:
              raise RuntimeError("Unexpected number of image rows to replace")
          for old_asset in (
              "frameworks-sorted-20261123",
              "tools-sorted-20261123",
              "databases-sorted-20261123"
          ):
              if old_asset not in previous_section:
                  raise RuntimeError(f"Expected asset missing: {old_asset}")
          def picture(name, labels):
              a = ", ".join(labels[:-1])
              alt = f"Iconos y nombres: {a} y {labels[-1]}"
              return (
                  '<p align="left">\n'
                  '  <picture>\n'
                  f'    <source media="(prefers-color-scheme: dark)" srcset="assets/tech-icons/{name}-dark.png">\n'
                  f'    <source media="(prefers-color-scheme: light)" srcset="assets/tech-icons/{name}-light.png">\n'
                  f'    <img src="assets/tech-icons/{name}-light.png" alt="{alt}" width="800">\n'
                  '  </picture>\n'
                  '</p>'
              )
          dev = (
              "**Desarrollo de aplicaciones y frameworks**\n\n"
              + picture("ides-v2-20261123", new_groups["ides-v2-20261123"])
              + "\n\n"
              + picture("frameworks-v2-20261123", new_groups["frameworks-v2-20261123"])
              + "\n\n"
          )
          db = (
              "**Bases de datos, pruebas y herramientas**\n\n"
              + picture("databases-v2-20261123", new_groups["databases-v2-20261123"])
              + "\n\n"
              + picture("tools-v2-20261123", new_groups["tools-v2-20261123"])
              + "\n\n"
          )
          text = text[:first] + dev + db + text[last:]
          if text.count("<picture>") != 5 or text.count('width="800"') != 5:
              raise RuntimeError("Expected one language row and four newly grouped rows")
          for item in ("FitnessApp", "HorseApp", "SwiftUI", "Odoo", "Qiskit Hackathon"):
              if item not in text:
                  raise RuntimeError(f"Unrelated README information missing: {item}")
          if "languages-sorted-20261123-dark.png" not in text:
              raise RuntimeError("Language icons were unexpectedly modified")
          readme_file.write_text(text, encoding="utf-8")
          PY
      - name: Publish updated rows and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/tech-icons/*-v2-20261123-*.png
          git rm .github/workflows/group-profile-technologies-once.yml
          git diff --cached --stat
          git commit -m "Add Eclipse and group IDEs, databases and test tools in profile"
          git push origin HEAD:main
