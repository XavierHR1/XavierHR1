name: Add Swift, SwiftUI and Xcode to profile without changing existing icons
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/add-swift-to-profile-once.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install image tooling
        run: python3 -m pip install --disable-pip-version-check pillow cairosvg
      - name: Get GitHub font and new icons
        run: |
          mkdir -p /tmp/extra-profile-icons
          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/github/mona-sans/main/fonts/static/otf/MonaSans-Regular.otf" \
            -o /tmp/extra-profile-icons/MonaSans-Regular.otf
          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/tandpfun/skill-icons/main/icons/Swift.svg" \
            -o /tmp/extra-profile-icons/swift.svg
          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/syvixor/skills-icons/main/icons/swiftui.svg" \
            -o /tmp/extra-profile-icons/swiftui.svg
          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/syvixor/skills-icons/main/icons/xcode.svg" \
            -o /tmp/extra-profile-icons/xcode.svg
          test -s /tmp/extra-profile-icons/MonaSans-Regular.otf
      - name: Extend technology rows without altering original icon pixels
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import io
          import hashlib
          import cairosvg
          from PIL import Image, ImageDraw, ImageFont

          folder = Path("assets/tech-icons")
          sources = Path("/tmp/extra-profile-icons")
          font = ImageFont.truetype(str(sources / "MonaSans-Regular.otf"), 24)
          theme_colors = {"dark": "#f0f6fc", "light": "#1f2328"}
          cell_width = 182   # Original width: 91 CSS pixels at 2x
          image_height = 168
          icon_size = 104   # Original icon size: 52 CSS pixels at 2x
          icon_y = 8
          label_baseline = 148
          
          new_icons = {}
          for key in ("swift", "swiftui", "xcode"):
              data = (sources / f"{key}.svg").read_bytes()
              png_data = cairosvg.svg2png(
                  bytestring=data,
                  output_width=icon_size,
                  output_height=icon_size
              )
              with Image.open(io.BytesIO(png_data)) as im:
                  icon = im.convert("RGBA")
              if icon.size != (icon_size, icon_size) or icon.getbbox() is None:
                  raise RuntimeError(f"Invalid icon: {key}")
              new_icons[key] = icon
          
          additions = {
              "languages": [
                  ("swift", "Swift"),
              ],
              "frameworks": [
                  ("swiftui", "SwiftUI"),
                  ("xcode", "Xcode"),
              ]
          }
          original_widths = {"languages": 1820, "frameworks": 1638}
          for name, entries in additions.items():
              for theme, text_color in theme_colors.items():
                  filepath = folder / f"{name}-{theme}.png"
                  with Image.open(filepath) as im:
                      original = im.convert("RGBA")
                  if original.size != (original_widths[name], image_height):
                      raise RuntimeError(f"Unexpected original dimensions: {filepath}, {original.size}")
                  
                  original_hash = hashlib.sha256(original.tobytes()).hexdigest()
                  canvas = Image.new(
                      "RGBA",
                      (original.width + cell_width * len(entries), image_height),
                      (0, 0, 0, 0)
                  )
                  canvas.paste(original, (0, 0))
                  draw = ImageDraw.Draw(canvas)
                  for i, (slug, label) in enumerate(entries):
                      x0 = original.width + i * cell_width
                      # Match existing icon placement without shifting any previous cells.
                      canvas.alpha_composite(new_icons[slug], dest=(x0 + 39, icon_y))
                      # GitHub Mona Sans 12px at CSS scale 2; same theme-aware text color.
                      draw.text(
                          (x0 + cell_width // 2, label_baseline),
                          label,
                          font=font,
                          fill=text_color,
                          anchor="ms",
                      )
                  
                  original_after = canvas.crop((0, 0, original.width, image_height))
                  new_hash = hashlib.sha256(original_after.tobytes()).hexdigest()
                  if original_hash != new_hash:
                      raise RuntimeError(f"Original icons or labels were changed: {filepath}")
                  canvas.save(filepath, format="PNG", optimize=True)
                  with Image.open(filepath) as check:
                      check.verify()
                  print(
                      f"Verified {filepath}: {canvas.width}x{canvas.height}; "
                      f"original pixels identical ({original_hash[:16]})"
                  )
          
          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")
          replacements = [
              (
                  "Desarrollo Android · Desarrollo web · Aplicaciones en tiempo real",
                  "Desarrollo Android y Apple · Desarrollo web · Aplicaciones en tiempo real",
              ),
              (
                  "- 🌐 **Desarrollo web:**",
                  "- 🍎 **Desarrollo Apple:** programación con **Swift** y creación de interfaces con **SwiftUI** utilizando **Xcode**.\n"
                  "- 🌐 **Desarrollo web:**",
              ),
              (
                  'Kotlin, Java, Python, PHP, JavaScript, TypeScript, HTML, CSS, C y C#" width="910"',
                  'Kotlin, Java, Python, PHP, JavaScript, TypeScript, HTML, CSS, C, C# y Swift" width="1001"',
              ),
              (
                  'Android Studio, React, Next.js, Tailwind CSS, Node.js, Express, Vite, Firebase y Gradle" width="819"',
                  'Android Studio, React, Next.js, Tailwind CSS, Node.js, Express, Vite, Firebase, Gradle, SwiftUI y Xcode" width="1001"',
              ),
          ]
          for before, after in replacements:
              if readme.count(before) != 1:
                  raise RuntimeError(f"README reference changed unexpectedly: {before[:90]}")
              readme = readme.replace(before, after, 1)
          if readme.count("<picture>") != 3:
              raise RuntimeError("Original theme-aware layout missing")
          if not all(k in readme for k in ("FitnessApp", "HorseApp", "Odoo", "Qiskit Hackathon")):
              raise RuntimeError("Unrelated README content was changed")
          readme_path.write_text(readme, encoding="utf-8")
          PY
      - name: Publish and delete one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/tech-icons/languages-dark.png assets/tech-icons/languages-light.png assets/tech-icons/frameworks-dark.png assets/tech-icons/frameworks-light.png
          git rm .github/workflows/add-swift-to-profile-once.yml
          git diff --cached --stat
          git commit -m "Add Swift, SwiftUI and Xcode to profile and technology icons"
          git push origin HEAD:main
