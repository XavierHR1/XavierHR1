name: Split programming and web markup icons (one-time)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/split-programming-markup-once.yml

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Pillow
        run: python3 -m pip install --disable-pip-version-check pillow

      - name: Split language icons preserving original pixels
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          from PIL import Image, ImageChops

          root = Path("assets/tech-icons")
          cell_width, row_width, row_height = 182, 2002, 168
          names = [
              "Kotlin", "Java", "Python", "C", "C#", "Swift",
              "PHP", "JavaScript", "TypeScript", "HTML", "CSS"
          ]
          groups = {
              "languages-programming-20261123": (list(range(9)), names[:9]),
              "languages-web-20261123": ([9, 10], names[9:]),
          }

          for theme in ("dark", "light"):
              src = root / f"languages-sorted-20261123-{theme}.png"
              with Image.open(src) as img:
                  source = img.convert("RGBA")
              if source.size != (row_width, row_height):
                  raise RuntimeError(f"Unexpected source dimensions: {src}: {source.size}")

              for output_name, (source_indices, labels) in groups.items():
                  dest = root / f"{output_name}-{theme}.png"
                  if dest.exists():
                      raise RuntimeError(f"Output file already exists: {dest}")
                  output = Image.new("RGBA", (row_width, row_height), (0, 0, 0, 0))

                  for target_index, source_index in enumerate(source_indices):
                      tile = source.crop((
                          source_index * cell_width, 0,
                          (source_index + 1) * cell_width, row_height
                      ))
                      if tile.getbbox() is None:
                          raise RuntimeError(f"Missing source icon {names[source_index]} in {src}")
                      output.paste(tile, (target_index * cell_width, 0))
                      recovered = output.crop((
                          target_index * cell_width, 0,
                          (target_index + 1) * cell_width, row_height
                      ))
                      if sha256(tile.tobytes()).digest() != sha256(recovered.tobytes()).digest():
                          raise RuntimeError(f"Pixels changed for {names[source_index]}")
                      if ImageChops.difference(tile, recovered).getbbox():
                          raise RuntimeError(f"Visual pixels changed for {names[source_index]}")

                  if output.crop((len(source_indices) * cell_width, 0, row_width, row_height)).getbbox():
                      raise RuntimeError(f"Unexpected icons after {labels[-1]}")
                  output.save(dest, format="PNG", optimize=True)
                  with Image.open(dest) as verify:
                      verify.verify()
                  print(f"VERIFIED {dest}: {len(labels)} original icons unchanged, width 800px, {', '.join(labels)}")

          readme_file = Path("README.md")
          readme = readme_file.read_text(encoding="utf-8")
          head = "**Lenguajes de programación y web**"
          next_heading = "**Desarrollo de aplicaciones y frameworks**"
          start = readme.index(head)
          end = readme.index(next_heading, start + len(head))
          old_section = readme[start:end]
          if old_section.count("<picture>") != 1:
              raise RuntimeError("Expected exactly one existing language icon row")
          for theme in ("dark", "light"):
              if f"assets/tech-icons/languages-sorted-20261123-{theme}.png" not in old_section:
                  raise RuntimeError(f"Missing original image reference for {theme}")

          def picture(basename, labels):
              alt = ", ".join(labels[:-1]) + " y " + labels[-1]
              return (
                  '<p align="left">\n'
                  '  <picture>\n'
                  f'    <source media="(prefers-color-scheme: dark)" srcset="assets/tech-icons/{basename}-dark.png">\n'
                  f'    <source media="(prefers-color-scheme: light)" srcset="assets/tech-icons/{basename}-light.png">\n'
                  f'    <img src="assets/tech-icons/{basename}-light.png" alt="Iconos y nombres: {alt}" width="800">\n'
                  '  </picture>\n'
                  '</p>'
              )

          replacement = (
              head + "\n\n"
              + picture("languages-programming-20261123", names[:9])
              + "\n\n"
              + picture("languages-web-20261123", names[9:])
              + "\n\n"
          )
          new_readme = readme[:start] + replacement + readme[end:]
          if new_readme.count("<picture>") != 7 or new_readme.count('width="800"') != 7:
              raise RuntimeError("Wrong number of rows or display widths")
          for required in ("databases-v2-20261123", "testing-v4-20261123",
                           "tools-v4-20261123", "FitnessApp", "HorseApp", "SwiftUI", "Odoo"):
              if required not in new_readme:
                  raise RuntimeError(f"Original README content unexpectedly missing: {required}")
          readme_file.write_text(new_readme, encoding="utf-8")
          print("VERIFIED README: language icons split into two rows; unrelated sections unchanged")
          PY

      - name: Publish two rows and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/tech-icons/languages-programming-20261123-*.png assets/tech-icons/languages-web-20261123-*.png
          git rm .github/workflows/split-programming-markup-once.yml
          git diff --cached --stat
          git commit -m "Split programming and markup languages into two icon rows"
          git push origin HEAD:main
