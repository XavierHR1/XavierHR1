name: Match GitHub README font and colors for technology labels (one-time)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/update-profile-typography-once.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PNG renderer
        run: python3 -m pip install --disable-pip-version-check cairosvg pillow
      - name: Load GitHub's open-source Mona Sans font
        run: |
          mkdir -p "$HOME/.local/share/fonts"
          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/github/mona-sans/main/fonts/static/otf/MonaSans-Regular.otf" \
            -o "$HOME/.local/share/fonts/MonaSans-Regular.otf"
          test -s "$HOME/.local/share/fonts/MonaSans-Regular.otf"
          fc-cache -f "$HOME/.local/share/fonts"
          fc-match "Mona Sans" -f "%{family}\n"
      - name: Generate dark and light PNGs with GitHub text colors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import cairosvg
          from PIL import Image

          directory = Path("assets/tech-icons")
          colors = {"dark": "#f0f6fc", "light": "#1f2328"}
          widths = {"languages": 910, "frameworks": 819, "tools": 819}
          style_pattern = re.compile(r'<style><!\[CDATA\[\.tech-label.*?\]\]></style>', re.S)

          readme = Path("README.md")
          readme_text = readme.read_text(encoding="utf-8")

          for name, display_width in widths.items():
              src = (directory / f"{name}.svg").read_text(encoding="utf-8")
              if not style_pattern.search(src):
                  raise RuntimeError(f"Missing technology label style: {name}")
              for theme, color in colors.items():
                  # Only modify the text labels, never the technology illustrations.
                  new_style = (
                      '<style>.tech-label{font-family:"Mona Sans";'
                      'font-size:12px;font-weight:400;text-anchor:middle;'
                      f'fill:{color}}}</style>'
                  )
                  styled_svg = style_pattern.sub(lambda _: new_style, src, count=1)
                  png_path = directory / f"{name}-{theme}.png"
                  cairosvg.svg2png(
                      bytestring=styled_svg.encode("utf-8"),
                      write_to=str(png_path),
                      scale=2
                  )
                  with Image.open(png_path) as im:
                      im.verify()
                  with Image.open(png_path).convert("RGBA") as im:
                      if im.size != (display_width * 2, 168):
                          raise RuntimeError(f"Wrong image dimensions: {png_path}: {im.size}")
                      if im.getpixel((0, 0))[3] != 0:
                          raise RuntimeError(f"Background not transparent: {png_path}")
                      label_pixels = im.crop((0, 124, im.width, im.height)).getdata()
                      expected_rgb = tuple(bytes.fromhex(color.lstrip("#")))
                      if not any(px[:3] == expected_rgb and px[3] >= 200 for px in label_pixels):
                          raise RuntimeError(f"Incorrect text color in {png_path}")
                  print(f"Validated {png_path}: {png_path.stat().st_size} bytes")

              old = f'<img src="assets/tech-icons/{name}.png"'
              if readme_text.count(old) != 1:
                  raise RuntimeError(f"Expected one README reference to {old}")
              image_tag = re.search(r'<img src="assets/tech-icons/' + name + r'\.png" alt="([^"]+)" width="' + str(display_width) + r'">', readme_text)
              if image_tag is None:
                  raise RuntimeError(f"Image reference changed for {name}")
              alt = image_tag.group(1)
              replacement = (
                  '<picture>\n'
                  f'    <source media="(prefers-color-scheme: dark)" srcset="assets/tech-icons/{name}-dark.png">\n'
                  f'    <source media="(prefers-color-scheme: light)" srcset="assets/tech-icons/{name}-light.png">\n'
                  f'    <img src="assets/tech-icons/{name}-light.png" alt="{alt}" width="{display_width}">\n'
                  '  </picture>'
              )
              readme_text = readme_text.replace(image_tag.group(0), replacement, 1)

          if readme_text.count("<picture>") != 3:
              raise RuntimeError("Expected three independent image themes")
          for marker in ("FitnessApp", "HorseApp", "Odoo", "Qiskit Hackathon"):
              if marker not in readme_text:
                  raise RuntimeError(f"Unrelated README content missing: {marker}")
          readme.write_text(readme_text, encoding="utf-8")
          PY
      - name: Publish and remove the one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/tech-icons/languages-dark.png assets/tech-icons/languages-light.png assets/tech-icons/frameworks-dark.png assets/tech-icons/frameworks-light.png assets/tech-icons/tools-dark.png assets/tech-icons/tools-light.png
          git rm .github/workflows/update-profile-typography-once.yml
          git diff --cached --stat
          git commit -m "Match profile technology labels to GitHub fonts and themes"
          git push origin HEAD:main
